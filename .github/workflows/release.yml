name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Publish Windows release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Inspect release state
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pending = @(Get-ChildItem .changeset -Filter *.md | Where-Object Name -ne README.md).Count -gt 0
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release view "v$version" *> $null
          $exists = $LASTEXITCODE -eq 0
          "pending=$($pending.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Set up pnpm
        if: steps.release.outputs.pending == 'false' && steps.release.outputs.exists == 'false'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node.js
        if: steps.release.outputs.pending == 'false' && steps.release.outputs.exists == 'false'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        if: steps.release.outputs.pending == 'false' && steps.release.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile
      - name: Build stable Windows artifacts
        if: steps.release.outputs.pending == 'false' && steps.release.outputs.exists == 'false'
        run: pnpm build:desktop
      - name: Publish GitHub release
        if: steps.release.outputs.pending == 'false' && steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: RawSens v${{ steps.release.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: artifacts/*
